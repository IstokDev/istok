<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИСТОК — Игровая платформа</title>

    <!-- Подключаем внешние стили -->
    <link rel="stylesheet" href="style.css">

    <!-- Резервные стили на случай, если style.css не загрузился -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #121826;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #0a101c;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .logo {
            font-weight: bold;
            color: #66c0f4;
            font-size: 20px;
        }
        .balance {
            color: #a4e02e;
            font-weight: bold;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .game-card {
            background: #1a2238;
            border: 1px solid #2a3b50;
            border-radius: 10px;
            padding: 18px;
            transition: transform 0.2s, background 0.3s;
        }
        .game-card:hover {
            transform: translateY(-6px);
            background: #1e2740;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        .game-card h3 {
            color: #66c0f4;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .game-card p {
            color: #9aa7b8;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .price {
            font-weight: bold;
            color: #a4e02e;
        }
        button {
            background: #1a9fff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover {
            background: #188de0;
        }
        .status {
            text-align: center;
            padding: 20px;
            font-size: 16px;
            color: #9aa7b8;
        }
        .loading {
            color: #66c0f4;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- Шапка с логотипом и балансом -->
    <header>
        <div class="logo">🌐 ИС<span style="color:#1a9fff">ТОК</span></div>
        <div>🪙 Баланс: <span id="balance">100.00</span> $</div>
    </header>

    <!-- Контейнер для игр -->
    <main id="games-container" class="games-grid">
        <!-- Статус загрузки -->
        <div class="status loading">Загружаем игры...</div>
    </main>
    <!-- Основной скрипт для работы платформы -->
    <script>
        // Баланс игрока
        let balance = 100.0;

        // Функция: загружает список игр с сервера
        async function loadGames() {
            try {
                const response = await fetch('api/games.json');
                if (!response.ok) throw new Error('Сервер вернул ошибку');
                const games = await response.json();
                renderGames(games);
            } catch (error) {
                document.getElementById('games-container').innerHTML = `
                    <div class="status">
                        ❌ Не удалось загрузить игры.<br>
                        Проверь: 
                        <ul>
                            <li>Существует ли файл <code>api/games.json</code></li>
                            <li>Правильно ли он сгенерирован</li>
                            <li>Работает ли GitHub Pages</li>
                        </ul>
                    </div>
                `;
                console.error('Ошибка загрузки игр:', error);
            }
        }

        // Функция: отображает игры в виде карточек
        function renderGames(games) {
            const container = document.getElementById('games-container');
            container.innerHTML = ''; // Очищаем статус

            if (games.length === 0) {
                container.innerHTML = '<div class="status">📦 Нет доступных игр</div>';
                return;
            }

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <h3>${game.title}</h3>
                    <p>${game.description}</p>
                    <p><b>Жанр:</b> ${game.genre}</p>
                    <p><b>Версия:</b> ${game.version}</p>
                    <p class="price">Цена: $${game.price}</p>
                    <button onclick="buyAndPlay('${game.url}', ${game.price})">▶ Купить и запустить</button>
                `;
                container.appendChild(card);
            });
        }
        // Функция: покупка и запуск игры
        function buyAndPlay(gameUrl, price) {
            if (balance < price) {
                alert('❌ Недостаточно средств Пополни баланс.');
                return;
            }

            const confirmBuy = confirm(`Купить игру за $${price}?`);
            if (!confirmBuy) return;

            // Снимаем деньги
            balance -= price;
            document.getElementById('balance').textContent = balance.toFixed(2);

            // Открываем игру в новом окне
            const gameWindow = window.open('', '_blank');
            gameWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Игра: ${gameUrl.split('/').pop()}</title>
                    <style>
                        body, html { margin: 0; padding: 0; overflow: hidden; }
                        iframe { width: 100%; height: 100vh; border: none; }
                        .exit-btn {
                            position: fixed; top: 10px; right: 10px; z-index: 999;
                            background: #e74c3c; color: white; border: none;
                            padding: 10px 15px; border-radius: 5px; cursor: pointer;
                            font-size: 14px; font-weight: bold;
                        }
                    </style>
                </head>
                <body>
                    <button class="exit-btn" onclick="window.close()">❌ Выйти</button>
                    <iframe src="${gameUrl}"></iframe>
                </body>
                </html>
            `);
            gameWindow.document.close();
        }

        // Загружаем игры при открытии страницы
        window.onload = loadGames;
    </script>
</body>
</html>

<!-- 
    🛠️ Этот index.html работает с:
    - games/monopoly/manifest.json
    - api/games.json (генерируется автоматически)
    - GitHub Pages + GitHub Actions
    💡 Все пути относительные — работает везде
-->
