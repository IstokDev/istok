<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ИСТОК — Игровая платформа</title>

    <!-- Подключаем стили -->
    <link rel="stylesheet" href="style.css">

    <!-- Резервные стили на случай, если style.css не загрузился -->
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #121826;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            line-height: 1.6;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #0a101c;
            border-radius: 10px;
            margin-bottom: 25px;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
        .logo {
            font-weight: bold;
            color: #66c0f4;
            font-size: 20px;
        }
        .balance {
            color: #a4e02e;
            font-weight: bold;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-button {
            background: #1a2238;
            color: #9aa7b8;
            border: 1px solid #2a3b50;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .tab-button.active {
            background: #1e2740;
            color: #66c0f4;
            border-color: #66c0f4;
        }
        .tab-content {
            display: none;
        }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .game-card {
            background: #1a2238;
            border: 1px solid #2a3b50;
            border-radius: 10px;
            padding: 18px;
            transition: transform 0.2s, background 0.3s;
        }
        .game-card:hover {
            transform: translateY(-6px);
            background: #1e2740;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        .game-card h3 {
            color: #66c0f4;
            margin-bottom: 8px;
            font-size: 18px;
        }
        .game-card p {
            color: #9aa7b8;
            font-size: 14px;
            margin-bottom: 10px;
        }
        .price {
            font-weight: bold;
            color: #a4e02e;
        }
        button {
            background: #1a9fff;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            width: 100%;
            font-weight: 600;
            transition: background 0.2s;
        }
        button:hover {
            background: #188de0;
        }
        .status {
            text-align: center;
            padding: 20px;
            font-size: 16px;
            color: #9aa7b8;
        }
        .loading {
            color: #66c0f4;
            font-style: italic;
        }
        /* Форма публикации */
        #publish-tab input, #publish-tab textarea, #publish-tab select {
            width: 100%;
            padding: 10px;
            background: #2a3b50;
            border: 1px solid #405570;
            border-radius: 6px;
            color: white;
            margin-bottom: 5px;
        }
        #form-result.success {
            background: #1e3a2e;
            color: #a4e02e;
            border: 1px solid #2a5c38;
        }
        #form-result.error {
            background: #3a2020;
            color: #e04a4a;
            border: 1px solid #5c2a2a;
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="logo">🌐 ИС<span style="color:#1a9fff">ТОК</span></div>
        <div>🪙 Баланс: <span id="balance">100.00</span> $</div>
    </header>

    <!-- Вкладки -->
    <div class="tabs">
        <button class="tab-button active" onclick="switchTab('games-tab')">🎮 Игры</button>
        <button class="tab-button" onclick="switchTab('profile-tab')">👤 Профиль</button>
        <button class="tab-button" onclick="switchTab('publish-tab')">➕ Опубликовать</button>
    </div>

    <!-- Вкладка: Игры -->
    <main id="games-tab" class="tab-content" style="display: block;">
        <div id="games-container" class="games-grid">
            <div class="status loading">Загружаем игры...</div>
        </div>
    </main>

    <!-- Вкладка: Профиль -->
    <div id="profile-tab" class="tab-content">
        <div style="background: #1a2238; padding: 20px; border-radius: 10px;">
            <h3>👤 Ваш профиль</h3>
            <p><b>Никнейм:</b> <span id="profile-name">Гость</span></p>
            <p><b>Уровень:</b> <span id="profile-level">1</span></p>
            <p><b>Очки:</b> <span id="profile-steam-points">0</span></p>
            <p><b>Игр куплено:</b> <span id="profile-games">0</span></p>
            <button onclick="loginAsDev()">Войти как разработчик</button>
        </div>
    </div>

    <!-- Вкладка: Опубликовать игру -->
    <div id="publish-tab" class="tab-content">
        <h2 style="color: #66c0f4;">📤 Опубликовать игру</h2>
        <p style="color: #9aa7b8; margin-bottom: 20px;">
            Заполните форму — и мы добавим вашу игру в магазин!
        </p>

        <form id="game-upload-form" onsubmit="return false;" style="display: grid; gap: 15px;">
            <div>
                <label style="color: #eee;">Название игры</label>
                <input type="text" id="game-title" required>
            </div>
            <div>
                <label style="color: #eee;">Описание</label>
                <textarea id="game-desc" rows="3" required></textarea>
            </div>
            <div>
                <label style="color: #eee;">Жанр</label>
                <select id="game-genre">
                    <option>аркада</option>
                    <option>головоломка</option>
                    <option>стратегия</option>
                    <option>платформер</option>
                    <option>мини-игра</option>
                    <option>другое</option>
                </select>
            </div>
            <div>
                <label style="color: #eee;">Цена ($)</label>
                <input type="number" id="game-price" value="0" min="0" step="0.5">
            </div>
            <div>
                <label style="color: #eee;">Файл игры (.html)</label>
                <input type="file" id="game-file" accept=".html" required>
            </div>
            <div>
                <label style="color: #eee;">Ваш никнейм</label>
                <input type="text" id="game-developer" required>
            </div>
            <button onclick="submitGameForm()" style="background: #66c0f4;">📤 Отправить на проверку</button>
        </form>

        <div id="form-result" style="margin-top: 20px; padding: 15px; border-radius: 6px; display: none;"></div>
    </div>

    <script>
        // Глобальные переменные
        let balance = 100.0;
        let userLevel = 1;
        let steamPoints = 0;
        let gamesOwned = 0;
        let isLoggedIn = false;

        // Переключение вкладок
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.style.display = 'none';
            });
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(tabId).style.display = 'block';
            const activeBtn = [...document.querySelectorAll('.tab-button')].find(btn => 
                btn.textContent.includes(
                    tabId === 'games-tab' ? 'Игры' :
                    tabId === 'profile-tab' ? 'Профиль' : 'Опубликовать'
                )
            );
            if (activeBtn) activeBtn.classList.add('active');
        }

        // Загрузка игр
        async function loadGames() {
            try {
                const response = await fetch('api/games.json');
                if (!response.ok) throw new Error('Сетевая ошибка');
                const games = await response.json();
                renderGames(games);
            } catch (error) {
                const container = document.getElementById('games-container');
                container.innerHTML = `
                    <div class="status">
                        ❌ Не удалось загрузить игры.<br>
                        Проверьте: <br>
                        • Существует ли <code>api/games.json</code><br>
                        • Работает ли GitHub Actions
                    </div>
                `;
                console.error('Ошибка:', error);
            }
        }

        // Отображение игр
        function renderGames(games) {
            const container = document.getElementById('games-container');
            container.innerHTML = '';

            if (games.length === 0) {
                container.innerHTML = '<div class="status">📦 Нет доступных игр</div>';
                return;
            }

            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card';
                card.innerHTML = `
                    <h3>${game.title}</h3>
                    <p>${game.description}</p>
                    <p><b>Жанр:</b> ${game.genre}</p>
                    <p class="price">Цена: $${game.price}</p>
                    <button onclick="buyAndPlay('${game.url}', ${game.price}, '${game.title}')">▶ Купить и запустить</button>
                `;
                container.appendChild(card);
            });
        }

        // Покупка и запуск игры
        function buyAndPlay(gameUrl, price, title) {
            if (balance < price) {
                alert('❌ Недостаточно средств!');
                return;
            }

            if (!confirm(`Купить "${title}" за $${price}?`)) return;

            balance -= price;
            gamesOwned++;
            steamPoints += 50;
            userLevel = Math.floor(steamPoints / 100) + 1;

            document.getElementById('balance').textContent = balance.toFixed(2);
            updateProfile();

            const win = window.open('', '_blank');
            win.document.write(`
                <!DOCTYPE html>
                <html><head><title>Игра: ${title}</title>
                <style>body,html{margin:0;padding:0;overflow:hidden;}
                iframe{width:100%;height:100vh;border:none;}
                .exit{position:fixed;top:10px;right:10px;z-index:999;background:#e74c3c;color:white;border:none;padding:10px;border-radius:5px;cursor:pointer;}</style>
                </head><body>
                <button class="exit" onclick="window.close()">❌ Выйти</button>
                <iframe src="${gameUrl}"></iframe>
                </body></html>
            `);
            win.document.close();
        }

        // Обновление профиля
        function updateProfile() {
            const nameEl = document.getElementById('profile-name');
            const levelEl = document.getElementById('profile-level');
            const pointsEl = document.getElementById('profile-steam-points');
            const gamesEl = document.getElementById('profile-games');

            if (nameEl) nameEl.textContent = isLoggedIn ? 'IstokDev' : 'Гость';
            if (levelEl) levelEl.textContent = userLevel;
            if (pointsEl) pointsEl.textContent = steamPoints;
            if (gamesEl) gamesEl.textContent = gamesOwned;
        }

        // Вход как разработчик
        function loginAsDev() {
            isLoggedIn = true;
            alert('✅ Вы вошли как разработчик!');
            updateProfile();
        }

        // Форма: отправка
        function submitGameForm() {
            const title = document.getElementById('game-title').value.trim();
            const desc = document.getElementById('game-desc').value.trim();
            const genre = document.getElementById('game-genre').value;
            const price = parseFloat(document.getElementById('game-price').value);
            const file = document.getElementById('game-file').files[0];
            const developer = document.getElementById('game-developer').value.trim();
            const resultDiv = document.getElementById('form-result');

            if (!title || !desc || !file || !developer) {
                resultDiv.style.display = 'block';
                resultDiv.className = 'status error';
                resultDiv.textContent = '❌ Заполните все поля!';
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.className = 'status success';
            resultDiv.innerHTML = `
                ✅ Форма отправлена!<br>
                Игра: <b>${title}</b><br>
                Разработчик: <b>${developer}</b><br><br>
                📬 Я получил вашу заявку. Через 1–2 дня игра появится в магазине!
            `;

            // Сброс формы
            document.getElementById('game-upload-form').reset();
        }

        // Инициализация
        window.onload = function () {
            updateProfile();
            loadGames();
        };
    </script>
</body>
</html>
